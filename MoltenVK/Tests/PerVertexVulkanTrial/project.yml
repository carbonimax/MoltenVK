# XcodeGen spec of the PerVertex Vulkan trial app. build-trial.sh generates the project into its output directory,
# next to the iOS test library and the SPIR-V it embeds. It sets, as absolute paths: TRIAL_BUILD (that directory) and
# TRIAL_TESTS (MoltenVK/Tests, whose fixtures the app compiles).
name: PerVertexVulkanTrial
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
targets:
  PerVertexVulkanTrial:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [LossFixture.mm]
      - path: Sources/LossFixture.mm
        compilerFlags: [-fno-objc-arc]
      - path: ${TRIAL_BUILD}/Shaders
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ${TRIAL_BUILD}/Frameworks/libMoltenVK.1.dylib
        embed: true
        codeSign: true
    info:
      path: ${TRIAL_BUILD}/Info.plist
      properties:
        CFBundleDisplayName: PerVertex Vulkan
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.meunier.PerVertexVulkanTrial
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        HEADER_SEARCH_PATHS: ["${TRIAL_TESTS}/../../External/Vulkan-Headers/include", "${TRIAL_TESTS}", "${TRIAL_TESTS}/PerVertexMesh"]
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "${TRIAL_BUILD}/Frameworks"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "-Wno-unused-function", "-Wno-main"]
        ENABLE_BITCODE: NO
